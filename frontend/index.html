<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StoryForge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EEF2F5;
    --sheet: #FFFFFF;
    --ink: #1D2733;
    --ink-soft: #55616F;
    --rule: #D3DBE3;
    --pencil: #2F6FB5;
    --pencil-wash: #E3EDF8;
    --red: #C4323C;
    --red-wash: #FBEAEB;
    --amber: #A86A12;
    --amber-wash: #FBF1E0;
    --serif: "Literata", Georgia, "Times New Roman", serif;
    --sans: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font: 16px/1.5 var(--sans);
  }
  button, input, textarea, select { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--pencil); outline-offset: 2px; }

  /* ---------- layout ---------- */
  .shell { display: grid; grid-template-columns: 17rem 1fr; min-height: 100vh; }
  aside {
    border-right: 1px solid var(--rule);
    padding: 1.5rem 1.25rem;
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  main { padding: 1.5rem clamp(1rem, 4vw, 3rem) 4rem; max-width: 64rem; width: 100%; }

  .brand { font: 600 1.6rem/1.1 var(--serif); margin: 0 0 1.5rem; letter-spacing: -0.01em; }
  .brand span { display: block; font: 400 0.85rem/1.3 var(--sans); color: var(--ink-soft); margin-top: .35rem; letter-spacing: 0; }

  .book-switch { margin: 0 0 1.75rem; }
  .book-switch label { font-size: .85rem; }
  .book-switch .manage { font-size: .85rem; display: inline-block; margin-top: .35rem; color: var(--pencil); }
  .book-list { list-style: none; padding: 0; margin: 0 0 2rem; }
  .book-list li { display: flex; flex-wrap: wrap; gap: .5rem 1rem; align-items: center; background: var(--sheet); border: 1px solid var(--rule); border-radius: 4px; padding: .75rem 1rem; margin-bottom: .5rem; }
  .book-list li.current { box-shadow: inset 3px 0 0 var(--pencil); }
  .book-list .bname { font: 600 1.1rem var(--serif); flex: 1 1 12rem; }
  .book-list .bmeta { color: var(--ink-soft); font-size: .88rem; }
  .book-list input { max-width: 18rem; }
  .side-head { display: flex; justify-content: space-between; align-items: baseline; margin: 0 0 .5rem; }
  .side-head h2 { font-size: .95rem; margin: 0; }
  .chapter-list { list-style: none; margin: 0; padding: 0; }
  .chapter-list a {
    display: grid; grid-template-columns: 2rem 1fr auto; gap: .25rem; align-items: baseline;
    padding: .4rem .5rem; border-radius: 4px; color: var(--ink); text-decoration: none;
  }
  .chapter-list a:hover { background: var(--pencil-wash); }
  .chapter-list a[aria-current="page"] { background: var(--sheet); box-shadow: inset 3px 0 0 var(--pencil); }
  .chapter-list .num { font: 600 .95rem var(--serif); color: var(--pencil); }
  .chapter-list .count { font-size: .8rem; color: var(--ink-soft); }
  .side-empty { color: var(--ink-soft); font-size: .9rem; }

  nav.tabs { display: flex; flex-wrap: wrap; gap: .25rem; border-bottom: 1px solid var(--rule); margin-bottom: 1.75rem; }
  nav.tabs a {
    padding: .55rem .9rem; color: var(--ink-soft); text-decoration: none; border-bottom: 3px solid transparent;
    margin-bottom: -1px; font-weight: 700;
  }
  nav.tabs a:hover { color: var(--ink); }
  nav.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--pencil); }
  nav.tabs .badge-count { background: var(--red); color: #fff; border-radius: 999px; padding: 0 .45rem; font-size: .75rem; margin-left: .3rem; }

  h1 { font: 600 1.9rem/1.2 var(--serif); margin: 0 0 .4rem; letter-spacing: -0.01em; }
  .lede { color: var(--ink-soft); margin: 0 0 1.5rem; max-width: 60ch; }
  h3 { font: 600 1.15rem/1.3 var(--serif); margin: 2rem 0 .75rem; }

  /* ---------- controls ---------- */
  label { display: block; font-weight: 700; font-size: .9rem; margin-bottom: .3rem; }
  .hint { font-weight: 400; color: var(--ink-soft); }
  input[type=text], input[type=number], textarea, select {
    width: 100%; padding: .55rem .7rem; background: var(--sheet);
    border: 1px solid var(--rule); border-radius: 4px;
  }
  textarea { font: 1rem/1.7 var(--serif); min-height: 16rem; resize: vertical; }
  .row { display: grid; grid-template-columns: 1fr 10rem; gap: 1rem; margin-bottom: 1rem; }
  .btn {
    background: var(--pencil); color: #fff; border: 0; border-radius: 4px;
    padding: .6rem 1.1rem; font-weight: 700; cursor: pointer;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn[disabled] { opacity: .6; cursor: progress; }
  .btn.quiet { background: transparent; color: var(--pencil); padding: .3rem .5rem; }
  .btn.quiet:hover { background: var(--pencil-wash); filter: none; }
  .btn.danger { background: transparent; color: var(--red); padding: .3rem .5rem; }
  .btn.danger:hover { background: var(--red-wash); filter: none; }
  .actions { display: flex; gap: .75rem; align-items: center; margin-top: 1rem; flex-wrap: wrap; }

  .notice { padding: .75rem 1rem; border-radius: 4px; margin: 1rem 0; background: var(--pencil-wash); }
  .notice.error { background: var(--red-wash); color: var(--red); }
  .empty { padding: 2.5rem 1rem; text-align: center; color: var(--ink-soft); border: 1px dashed var(--rule); border-radius: 6px; }

  /* ---------- confidence badge ---------- */
  .conf { display: inline-block; font-size: .78rem; font-weight: 700; padding: .05rem .5rem; border-radius: 999px; white-space: nowrap; }
  .conf.sure { background: var(--pencil-wash); color: var(--pencil); }
  .conf.likely { background: var(--amber-wash); color: var(--amber); }
  .conf.unsure { background: #EDEFF2; color: var(--ink-soft); }

  /* ---------- facts table ---------- */
  .table-wrap { overflow-x: auto; background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; }
  table { border-collapse: collapse; width: 100%; font-size: .92rem; }
  th, td { text-align: left; padding: .55rem .75rem; border-bottom: 1px solid var(--rule); vertical-align: top; }
  th { font-size: .82rem; color: var(--ink-soft); font-weight: 700; background: #F7F9FB; }
  tr:last-child td { border-bottom: 0; }
  td.quote { font: italic .92rem/1.5 var(--serif); color: var(--ink-soft); max-width: 22rem; }
  td.tools { white-space: nowrap; text-align: right; }
  td input { padding: .25rem .4rem; }

  /* ---------- the contradiction card: the one bold element ---------- */
  .issue { background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 1.1rem 1.25rem; margin-bottom: 1rem; }
  .issue.dismissed { opacity: .6; }
  .issue-head { display: flex; flex-wrap: wrap; gap: .5rem .75rem; align-items: baseline; margin-bottom: .6rem; }
  .issue-head strong { font: 600 1.1rem var(--serif); }
  .kind { font-size: .8rem; font-weight: 700; color: var(--red); }
  .issue p.why { margin: 0 0 1rem; max-width: 70ch; }
  .facing { display: grid; grid-template-columns: 1fr 2.5rem 1fr; align-items: stretch; }
  .slip {
    font: 1rem/1.65 var(--serif); padding: .8rem 1rem; background: #FBFCFD;
    border: 1px solid var(--rule); border-radius: 4px;
  }
  .slip .where { display: block; font: 700 .8rem var(--sans); color: var(--ink-soft); margin-bottom: .3rem; }
  .slip mark { background: none; color: inherit; text-decoration: underline wavy var(--red); text-underline-offset: 4px; text-decoration-thickness: 1.5px; }
  .mark { display: flex; align-items: center; justify-content: center; }
  .mark svg { width: 2rem; height: 2rem; }
  .issue .actions { margin-top: .75rem; }

  /* ---------- characters ---------- */
  .filter { max-width: 22rem; margin-bottom: 1.25rem; }
  .entity-group h3 { margin-top: 1.5rem; }
  .entity-list { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); gap: .5rem; }
  .entity-list a {
    display: block; padding: .7rem .9rem; background: var(--sheet); border: 1px solid var(--rule);
    border-radius: 4px; text-decoration: none; color: var(--ink);
  }
  .entity-list a:hover { border-color: var(--pencil); }
  .entity-list .ename { font: 600 1.05rem var(--serif); display: block; }
  .entity-list .aka { font-size: .82rem; color: var(--ink-soft); }
  .names { display: flex; flex-wrap: wrap; gap: .4rem; margin: .25rem 0 1rem; }
  .name-chip { display: inline-flex; align-items: center; gap: .25rem; background: var(--sheet); border: 1px solid var(--rule); border-radius: 999px; padding: .15rem .3rem .15rem .75rem; font-size: .9rem; }
  .name-chip button { border: 0; background: none; color: var(--ink-soft); cursor: pointer; border-radius: 999px; padding: 0 .4rem; }
  .name-chip button:hover { background: var(--red-wash); color: var(--red); }
  .sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; }
  .sheet dl { margin: 0; }
  .sheet .attr { display: grid; grid-template-columns: 12rem 1fr; gap: 1rem; padding: .75rem 1rem; border-bottom: 1px solid var(--rule); }
  .sheet .attr:last-child { border-bottom: 0; }
  .sheet dt { font-weight: 700; color: var(--ink-soft); font-size: .9rem; }
  .sheet dd { margin: 0; }
  .sheet .val { margin-bottom: .35rem; }
  .sheet .val small { color: var(--ink-soft); }
  .merge-box { display: flex; gap: .5rem; align-items: end; flex-wrap: wrap; margin-top: .5rem; }
  .merge-box select { max-width: 20rem; }

  /* ---------- timeline ---------- */
  .timeline { list-style: none; margin: 0; padding: 0 0 0 2.75rem; position: relative; }
  .timeline::before { content: ""; position: absolute; left: 1rem; top: .4rem; bottom: .4rem; width: 2px; background: var(--rule); }
  .timeline > li { position: relative; margin-bottom: 1.75rem; }
  .timeline .ch { position: absolute; left: -2.75rem; top: 0; width: 2rem; height: 2rem; border-radius: 50%; background: var(--sheet); border: 2px solid var(--pencil); color: var(--pencil); font: 600 .9rem/1.8rem var(--serif); text-align: center; }
  .timeline h4 { margin: .2rem 0 .5rem; font: 600 1.05rem var(--serif); }
  .event { background: var(--sheet); border: 1px solid var(--rule); border-radius: 4px; padding: .6rem .9rem; margin-bottom: .45rem; }
  .event .what { font-weight: 700; }
  .event q { display: block; font: italic .92rem/1.5 var(--serif); color: var(--ink-soft); margin-top: .2rem; }

  /* ---------- ask ---------- */
  .ask-row { display: flex; gap: .5rem; }
  .ask-row input { flex: 1; }
  .answer { font: 1.08rem/1.75 var(--serif); background: var(--sheet); border: 1px solid var(--rule); border-left: 3px solid var(--pencil); border-radius: 4px; padding: 1rem 1.25rem; margin: 1.25rem 0; max-width: 70ch; white-space: pre-wrap; }
  .sources { font-size: .9rem; padding-left: 1.2rem; color: var(--ink-soft); }
  .sources li { margin-bottom: .3rem; }

  .chapter-text { font: 1.02rem/1.8 var(--serif); background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 1.25rem 1.5rem; max-height: 26rem; overflow-y: auto; white-space: pre-wrap; max-width: 72ch; }

  .spinner { display: inline-block; width: 1rem; height: 1rem; border: 2px solid var(--rule); border-top-color: var(--pencil); border-radius: 50%; animation: spin 1s linear infinite; vertical-align: -2px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }

  @media (max-width: 760px) {
    .shell { grid-template-columns: 1fr; }
    aside { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--rule); }
    .row { grid-template-columns: 1fr; }
    .facing { grid-template-columns: 1fr; }
    .mark { padding: .3rem 0; transform: rotate(90deg); }
    .sheet .attr { grid-template-columns: 1fr; gap: .25rem; }
  }
</style>
</head>
<body>
<div class="shell">
  <aside>
    <p class="brand">StoryForge<span>Keeps your story consistent from chapter to chapter.</span></p>
    <div class="book-switch">
      <label for="book-select">Book</label>
      <select id="book-select" aria-label="Choose a book"></select>
      <a class="manage" href="#/books">New book, rename or delete</a>
    </div>
    <div class="side-head"><h2>Chapters</h2><a class="btn quiet" href="#/add">Add</a></div>
    <ol class="chapter-list" id="chapter-list"></ol>
  </aside>
  <main>
    <nav class="tabs" id="tabs">
      <a href="#/add" data-tab="add">Add chapter</a>
      <a href="#/issues" data-tab="issues">Issues <span class="badge-count" id="issue-count" hidden></span></a>
      <a href="#/characters" data-tab="characters">Characters &amp; places</a>
      <a href="#/timeline" data-tab="timeline">Timeline</a>
      <a href="#/ask" data-tab="ask">Ask</a>
    </nav>
    <div id="view"></div>
  </main>
</div>

<script>
/* The website talks to the backend at the same address it was loaded from.
   To point it somewhere else, open it as  index.html?api=https://your-backend  */
const API = (new URLSearchParams(location.search).get("api") || "").replace(/\/$/, "");
const view = document.getElementById("view");

// ---------- books ----------
let books = [];
let currentBook = null;
function rememberBook(id) { try { localStorage.setItem("storyforge-book", String(id)); } catch { /* not essential */ } }
function rememberedBook() { try { return Number(localStorage.getItem("storyforge-book")); } catch { return null; } }
function book(path, options) { return api(`/projects/${currentBook}${path}`, options); }

async function loadBooks() {
  ({ projects: books } = await api("/projects"));
  if (!books.some(b => b.id === currentBook)) {
    const saved = rememberedBook();
    currentBook = books.some(b => b.id === saved) ? saved : (books[0] ? books[0].id : null);
  }
  const select = document.getElementById("book-select");
  select.innerHTML = books.map(b => `<option value="${b.id}">${esc(b.name)}</option>`).join("");
  select.value = currentBook ?? "";
  select.disabled = books.length === 0;
}

async function viewBooks() {
  view.innerHTML = `
    <h1>Books</h1>
    <p class="lede">Each book keeps its own chapters, characters and warnings. Nothing is shared between books.</p>
    <ul class="book-list" id="book-list"></ul>
    <h3>Start a new book</h3>
    <div class="ask-row"><input type="text" id="new-book" aria-label="New book title" placeholder="Book title">
      <button class="btn" id="create-book">Create book</button></div>
    <div id="book-msg"></div>`;
  const msg = document.getElementById("book-msg");
  const list = document.getElementById("book-list");
  const render = () => {
    list.innerHTML = books.length ? books.map(b => `
      <li class="${b.id === currentBook ? "current" : ""}">
        <span class="bname">${esc(b.name)}</span>
        <span class="bmeta">${b.chapter_count} ${b.chapter_count === 1 ? "chapter" : "chapters"} · ${b.open_issue_count} open ${b.open_issue_count === 1 ? "issue" : "issues"}</span>
        ${b.id === currentBook ? "" : `<button class="btn quiet" data-open="${b.id}">Open</button>`}
        <button class="btn quiet" data-rename="${b.id}">Rename</button>
        <button class="btn danger" data-delete="${b.id}">Delete</button>
      </li>`).join("") : `<li class="side-empty">No books yet. Create one below to get started.</li>`;
  };
  render();
  const create = async () => {
    const name = document.getElementById("new-book").value.trim();
    if (!name) { msg.innerHTML = errorBox("Give the book a title."); return; }
    try {
      const b = await api("/projects", { method: "POST", body: { name } });
      currentBook = b.id; rememberBook(b.id);
      await loadBooks();
      location.hash = "#/add";
    } catch (err) { msg.innerHTML = errorBox(err); }
  };
  document.getElementById("create-book").onclick = create;
  document.getElementById("new-book").onkeydown = (e) => { if (e.key === "Enter") create(); };
  list.onclick = async (e) => {
    const t = e.target;
    try {
      if (t.dataset.open) {
        currentBook = Number(t.dataset.open); rememberBook(currentBook);
        await loadBooks(); location.hash = "#/add";
      } else if (t.dataset.rename) {
        const b = books.find(x => x.id === Number(t.dataset.rename));
        const name = prompt("New title for this book:", b.name);
        if (!name || !name.trim() || name.trim() === b.name) return;
        await api(`/projects/${b.id}`, { method: "PATCH", body: { name: name.trim() } });
        await loadBooks(); render(); refreshSidebar();
      } else if (t.dataset.delete) {
        const b = books.find(x => x.id === Number(t.dataset.delete));
        if (!confirm(`Delete “${b.name}” and everything in it: ${b.chapter_count} chapters, their facts, characters and warnings? This can't be undone.`)) return;
        await api(`/projects/${b.id}`, { method: "DELETE" });
        if (b.id === currentBook) currentBook = null;
        await loadBooks(); render(); refreshSidebar();
      }
    } catch (err) { msg.innerHTML = errorBox(err); }
  };
}

// ---------- helpers ----------
function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
async function api(path, options = {}) {
  const init = { ...options, headers: { "Content-Type": "application/json", ...(options.headers || {}) } };
  if (init.body && typeof init.body !== "string") init.body = JSON.stringify(init.body);
  let response;
  try {
    response = await fetch(API + path, init);
  } catch {
    throw new Error("Can't reach the StoryForge backend. Check that it's running (uvicorn main:app).");
  }
  const data = await response.json().catch(() => ({}));
  if (!response.ok) {
    let detail = data.detail;
    if (Array.isArray(detail)) detail = detail.map(d => d.msg).join("; ");
    throw new Error(detail || `Request failed (${response.status}).`);
  }
  return data;
}
function confBadge(c) {
  const n = Number(c);
  const [cls, word] = n >= 0.8 ? ["sure", "Sure"] : n >= 0.5 ? ["likely", "Likely"] : ["unsure", "Unsure"];
  return `<span class="conf ${cls}" title="Confidence ${Math.round(n * 100)}%">${word} · ${Math.round(n * 100)}%</span>`;
}
function errorBox(err) { return `<div class="notice error" role="alert">${esc(err.message || err)}</div>`; }
function loading(text) { return `<p><span class="spinner" aria-hidden="true"></span> ${esc(text)}</p>`; }
const KIND = { attribute: "Changed detail", status: "Impossible state", timeline: "Timeline conflict" };
const TYPE_TITLE = { character: "Characters", location: "Places", item: "Items", event: "Events", other: "Other" };
const pretty = s => String(s).replace(/_/g, " ");

// ---------- sidebar & counts ----------
async function refreshSidebar(activeChapter) {
  const list = document.getElementById("chapter-list");
  if (currentBook == null) {
    list.innerHTML = `<li class="side-empty">Create a book first.</li>`;
    document.getElementById("issue-count").hidden = true;
    return;
  }
  try {
    const { chapters } = await book("/chapters");
    list.innerHTML = chapters.length
      ? chapters.map(c => `<li><a href="#/chapter/${encodeURIComponent(c.chapter_id)}" ${c.chapter_id === activeChapter ? 'aria-current="page"' : ""}>
          <span class="num">${c.chapter_number}</span><span>${esc(c.chapter_id)}</span><span class="count">${c.fact_count} facts</span></a></li>`).join("")
      : `<li class="side-empty">No chapters yet. Add your first one to start the story's memory.</li>`;
  } catch (err) {
    list.innerHTML = `<li class="side-empty">${esc(err.message)}</li>`;
  }
  try {
    const { contradictions } = await book("/contradictions?status=open");
    const badge = document.getElementById("issue-count");
    badge.hidden = contradictions.length === 0;
    badge.textContent = contradictions.length;
  } catch { /* the sidebar message already explains the problem */ }
}

// ---------- views ----------
function viewAdd() {
  view.innerHTML = `
    <h1>Add a chapter</h1>
    <p class="hint" style="margin:-.2rem 0 .6rem">to ${esc((books.find(b => b.id === currentBook) || {}).name || "")}</p>
    <p class="lede">Paste a chapter. StoryForge notes every fact in it, works out who is who, and checks it against earlier chapters.</p>
    <div class="row">
      <div><label for="cid">Chapter name <span class="hint">(e.g. ch3; re-using a name replaces that chapter)</span></label>
        <input type="text" id="cid" autocomplete="off"></div>
      <div><label for="cnum">Chapter number <span class="hint">(optional)</span></label>
        <input type="number" id="cnum" min="1"></div>
    </div>
    <label for="ctext">Chapter text</label>
    <textarea id="ctext"></textarea>
    <div class="actions"><button class="btn" id="submit">Check chapter</button><span class="hint" id="status"></span></div>
    <div id="result"></div>`;
  document.getElementById("submit").onclick = async () => {
    const button = document.getElementById("submit");
    const result = document.getElementById("result");
    const body = {
      chapter_id: document.getElementById("cid").value.trim(),
      text: document.getElementById("ctext").value,
    };
    const num = document.getElementById("cnum").value;
    if (num) body.chapter_number = Number(num);
    if (!body.chapter_id || !body.text.trim()) {
      result.innerHTML = errorBox("Give the chapter a name and paste its text.");
      return;
    }
    button.disabled = true;
    result.innerHTML = loading("Reading the chapter and checking it against the story so far. This can take a minute for long chapters.");
    try {
      const r = await book("/chapters", { method: "POST", body });
      const linked = r.entity_links.filter(l => l.method === "AI match");
      const removed = r.contradictions.filter(c => c.status === "dismissed").length;
      r.contradictions = r.contradictions.filter(c => c.status !== "dismissed");
      result.innerHTML = `
        <div class="notice">Saved as chapter ${r.chapter_number}: ${r.facts.length} facts noted,
          ${r.contradictions.length ? `<strong>${r.contradictions.length} possible ${r.contradictions.length === 1 ? "mistake" : "mistakes"}</strong>` : "no mistakes found"}.
          ${removed ? `The double-check set aside ${removed} more that looked like normal story changes; see Issues → Dismissed.` : ""}</div>
        ${r.contradictions.length ? `<h3>Possible mistakes</h3>${r.contradictions.map(c => issueCard({ ...c, status: "open" }, false)).join("")}` : ""}
        ${linked.length ? `<h3>Names matched to earlier chapters</h3><ul>${linked.map(l => `<li>“${esc(l.name)}” is ${esc(l.canonical_name)} ${confBadge(l.confidence)}</li>`).join("")}</ul>` : ""}
        <div class="actions"><a class="btn quiet" href="#/chapter/${encodeURIComponent(r.chapter_id)}">See all facts from this chapter</a></div>`;
      refreshSidebar();
    } catch (err) {
      result.innerHTML = errorBox(err);
    } finally {
      button.disabled = false;
    }
  };
}

function highlight(quote, value) {
  const q = esc(quote), v = esc(value);
  if (v && q.toLowerCase().includes(v.toLowerCase())) {
    const i = q.toLowerCase().indexOf(v.toLowerCase());
    return q.slice(0, i) + "<mark>" + q.slice(i, i + v.length) + "</mark>" + q.slice(i + v.length);
  }
  return q;
}

function issueCard(c, withActions = true) {
  const redMark = `<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 10 C12 4, 20 4, 26 10 M26 10 l-5 -1 M26 10 l-1 -5 M26 22 C20 28, 12 28, 6 22 M6 22 l5 1 M6 22 l1 5" fill="none" stroke="#C4323C" stroke-width="2" stroke-linecap="round"/></svg>`;
  const earlier = c.conflicting_chapter_number != null ? `Chapter ${c.conflicting_chapter_number}` : esc(c.conflicting_chapter_id);
  const later = c.new_chapter_number != null ? `Chapter ${c.new_chapter_number}` : esc(c.new_chapter_id);
  return `
    <article class="issue ${c.status === "dismissed" ? "dismissed" : ""}">
      <div class="issue-head"><strong>${esc(c.entity)}</strong><span class="kind">${KIND[c.contradiction_type] || esc(c.contradiction_type)}</span>${confBadge(c.confidence)}</div>
      <p class="why">${esc(c.explanation)}</p>
      ${c.review_note ? `<p class="hint" style="margin:-.5rem 0 1rem">${esc(c.review_note)}</p>` : ""}
      <div class="facing">
        <div class="slip"><span class="where">${earlier}</span>${highlight(c.conflicting_quote, c.conflicting_value)}</div>
        <div class="mark">${redMark}</div>
        <div class="slip"><span class="where">${later}</span>${highlight(c.new_quote, c.new_value)}</div>
      </div>
      ${withActions && c.id != null ? `<div class="actions">
        ${c.status === "dismissed"
          ? `<button class="btn quiet" data-reopen="${c.id}">Reopen</button>`
          : `<button class="btn quiet" data-dismiss="${c.id}">Dismiss — it's intentional</button>`}
      </div>` : ""}
    </article>`;
}

async function viewIssues(filter = "open") {
  view.innerHTML = `
    <h1>Issues</h1>
    <p class="lede">Places where a chapter disagrees with an earlier one. Dismiss anything you meant on purpose.</p>
    <div class="actions" style="margin:0 0 1.25rem">
      <label for="issue-filter" style="margin:0">Show</label>
      <select id="issue-filter" style="width:auto">
        <option value="open">Open</option><option value="dismissed">Dismissed</option><option value="">All</option>
      </select>
    </div>
    <div id="issues">${loading("Loading issues…")}</div>`;
  const select = document.getElementById("issue-filter");
  select.value = filter;
  select.onchange = () => viewIssues(select.value);
  const box = document.getElementById("issues");
  try {
    const { contradictions } = await book("/contradictions" + (filter ? `?status=${filter}` : ""));
    box.innerHTML = contradictions.length
      ? contradictions.map(c => issueCard(c)).join("")
      : `<div class="empty">${filter === "open" ? "No open issues. Every chapter so far agrees with the others." : "Nothing here."}</div>`;
    box.onclick = async (e) => {
      const id = e.target.dataset.dismiss || e.target.dataset.reopen;
      if (!id) return;
      try {
        await book(`/contradictions/${id}`, { method: "PATCH", body: { status: e.target.dataset.dismiss ? "dismissed" : "open" } });
        viewIssues(filter);
        refreshSidebar();
      } catch (err) { box.insertAdjacentHTML("afterbegin", errorBox(err)); }
    };
  } catch (err) { box.innerHTML = errorBox(err); }
}

async function viewCharacters() {
  view.innerHTML = `<h1>Characters &amp; places</h1>
    <p class="lede">Everyone and everything the story has mentioned, with every name each one goes by.</p>
    <input type="text" class="filter" id="entity-filter" placeholder="Filter by name" aria-label="Filter by name">
    <div id="entities">${loading("Loading…")}</div>`;
  const box = document.getElementById("entities");
  try {
    const { entities } = await book("/entities");
    const render = (term) => {
      const t = term.toLowerCase();
      const shown = entities.filter(e => !t || e.aliases.concat(e.canonical_name).some(n => n.toLowerCase().includes(t)));
      if (!entities.length) { box.innerHTML = `<div class="empty">Add a chapter and the people, places and things in it will appear here.</div>`; return; }
      if (!shown.length) { box.innerHTML = `<div class="empty">No names match “${esc(term)}”.</div>`; return; }
      const groups = {};
      shown.forEach(e => (groups[e.entity_type] ||= []).push(e));
      box.innerHTML = Object.keys(TYPE_TITLE).filter(t => groups[t]).map(t => `
        <section class="entity-group"><h3>${TYPE_TITLE[t]}</h3><ul class="entity-list">
          ${groups[t].map(e => {
            const others = e.aliases.filter(a => a.toLowerCase() !== e.canonical_name.toLowerCase());
            return `<li><a href="#/characters/${e.id}"><span class="ename">${esc(e.canonical_name)}</span>
              <span class="aka">${others.length ? "Also: " + others.map(esc).join(", ") + " · " : ""}${e.fact_count} facts</span></a></li>`;
          }).join("")}
        </ul></section>`).join("");
    };
    render("");
    document.getElementById("entity-filter").oninput = (e) => render(e.target.value);
  } catch (err) { box.innerHTML = errorBox(err); }
}

async function viewEntity(id) {
  view.innerHTML = loading("Loading…");
  try {
    const [entity, { entities }] = await Promise.all([book(`/entities/${id}`), book("/entities")]);
    const byAttr = {};
    entity.facts.forEach(f => (byAttr[f.attribute] ||= []).push(f));
    const others = entities.filter(e => e.id !== entity.id && e.entity_type === entity.entity_type);
    view.innerHTML = `
      <p><a class="btn quiet" href="#/characters">All characters &amp; places</a></p>
      <h1>${esc(entity.canonical_name)}</h1>
      <p class="lede">${esc(TYPE_TITLE[entity.entity_type]?.replace(/s$/, "") || entity.entity_type)} · ${entity.fact_count} facts across the story</p>
      <label>Known as</label>
      <div class="names">${entity.aliases.map(a => `<span class="name-chip">${esc(a)}${entity.aliases.length > 1
        ? `<button title="This name is someone else — split it off" aria-label="Split off ${esc(a)}" data-detach="${esc(a)}">×</button>` : ""}</span>`).join("")}</div>
      ${others.length ? `<div class="merge-box"><div><label for="merge-with">Same as another entry? <span class="hint">Merge it into ${esc(entity.canonical_name)}</span></label>
        <select id="merge-with"><option value="">Choose…</option>${others.map(o => `<option value="${o.id}">${esc(o.canonical_name)}</option>`).join("")}</select></div>
        <button class="btn" id="merge">Merge</button></div>` : ""}
      <div id="entity-msg"></div>
      <h3>What the story says</h3>
      ${entity.facts.length ? `<div class="sheet"><dl>${Object.entries(byAttr).map(([attr, facts]) => `
        <div class="attr"><dt>${esc(pretty(attr))}</dt><dd>${facts.map(f => `
          <div class="val">${esc(f.value)} <small>— ch. ${f.chapter_number}, as “${esc(f.entity)}”</small> ${confBadge(f.confidence)}</div>`).join("")}</dd></div>`).join("")}
      </dl></div>` : `<div class="empty">No facts left for this entry.</div>`}`;
    const msg = document.getElementById("entity-msg");
    view.querySelectorAll("[data-detach]").forEach(b => b.onclick = async () => {
      const name = b.dataset.detach;
      if (!confirm(`Split “${name}” off into its own entry? Facts written under that name go with it.`)) return;
      try {
        const r = await book(`/entities/${entity.id}/detach`, { method: "POST", body: { name } });
        location.hash = `#/characters/${r.kept.id}`;
        viewEntity(r.kept.id);
      } catch (err) { msg.innerHTML = errorBox(err); }
    });
    const merge = document.getElementById("merge");
    if (merge) merge.onclick = async () => {
      const other = document.getElementById("merge-with").value;
      if (!other) { msg.innerHTML = errorBox("Choose the entry to merge in."); return; }
      try {
        await book("/entities/merge", { method: "POST", body: { keep_entity_id: entity.id, merge_entity_id: Number(other) } });
        msg.innerHTML = `<div class="notice">Merged. Re-submit later chapters to re-check them with the combined facts.</div>`;
        setTimeout(() => viewEntity(entity.id), 900);
      } catch (err) { msg.innerHTML = errorBox(err); }
    };
  } catch (err) { view.innerHTML = errorBox(err); }
}

async function viewTimeline() {
  view.innerHTML = `<h1>Timeline</h1><p class="lede">Events in the order the reader meets them.</p><div id="tl">${loading("Loading…")}</div>`;
  const box = document.getElementById("tl");
  try {
    const { events } = await book("/timeline");
    if (!events.length) { box.innerHTML = `<div class="empty">No events yet. They'll appear here as you add chapters.</div>`; return; }
    const byChapter = [];
    events.forEach(e => {
      const last = byChapter[byChapter.length - 1];
      if (last && last.num === e.chapter_number) last.items.push(e);
      else byChapter.push({ num: e.chapter_number, id: e.chapter_id, items: [e] });
    });
    box.innerHTML = `<ol class="timeline">${byChapter.map(g => `
      <li><span class="ch">${g.num}</span><h4>${esc(g.id)}</h4>
        ${g.items.map(e => `<div class="event"><span class="what">${esc(e.canonical_name || e.entity)}</span>: ${esc(pretty(e.attribute))} — ${esc(e.value)}
          <q>${esc(e.source_quote)}</q></div>`).join("")}
      </li>`).join("")}</ol>`;
  } catch (err) { box.innerHTML = errorBox(err); }
}

function viewAsk() {
  view.innerHTML = `<h1>Ask about your story</h1>
    <p class="lede">Ask in plain words, like “What do we know about the lighthouse?” or “Who has been injured?”. Answers only use facts from your chapters.</p>
    <div class="ask-row"><input type="text" id="q" aria-label="Your question"><button class="btn" id="ask">Ask</button></div>
    <div id="answer"></div>`;
  const run = async () => {
    const question = document.getElementById("q").value.trim();
    const box = document.getElementById("answer");
    if (!question) return;
    box.innerHTML = loading("Looking through the story…");
    try {
      const r = await book("/ask", { method: "POST", body: { question } });
      box.innerHTML = `<div class="answer">${esc(r.answer)}</div>
        ${r.sources.length ? `<h3>Facts used</h3><ul class="sources">${r.sources.map(s =>
          `<li>ch. ${s.chapter_number}: ${esc(s.canonical_name || s.entity)}, ${esc(pretty(s.attribute))} — ${esc(s.value)}</li>`).join("")}</ul>` : ""}`;
    } catch (err) { box.innerHTML = errorBox(err); }
  };
  document.getElementById("ask").onclick = run;
  document.getElementById("q").onkeydown = (e) => { if (e.key === "Enter") run(); };
}

async function viewChapter(chapterId) {
  view.innerHTML = loading("Loading chapter…");
  try {
    const ch = await book(`/chapters/${encodeURIComponent(chapterId)}`);
    view.innerHTML = `
      <h1>Chapter ${ch.chapter_number}: ${esc(ch.chapter_id)}</h1>
      <p class="lede">${ch.time_note ? `When it's set: ${esc(ch.time_note)}. ` : ""}${ch.facts.length} facts noted. Fix anything the AI got wrong; your corrections are saved.</p>
      <div class="chapter-text">${esc(ch.text)}</div>
      <div class="actions">
        <a class="btn quiet" href="#/add" id="resubmit">Edit and re-check this chapter</a>
        <button class="btn danger" id="delete-chapter">Delete chapter</button>
      </div>
      <h3>Facts from this chapter</h3>
      <div id="fact-msg"></div>
      ${ch.facts.length ? `<div class="table-wrap"><table>
        <thead><tr><th>Who / what</th><th>Detail</th><th>Value</th><th>From the text</th><th>Confidence</th><th><span class="hint">Actions</span></th></tr></thead>
        <tbody>${ch.facts.map(f => `<tr data-fact="${f.fact_id}">
          <td>${esc(f.canonical_name || f.entity)}${f.canonical_name && f.canonical_name !== f.entity ? `<br><small class="hint">as “${esc(f.entity)}”</small>` : ""}</td>
          <td class="f-attr">${esc(pretty(f.attribute))}</td><td class="f-val">${esc(f.value)}</td>
          <td class="quote">${esc(f.source_quote)}</td><td>${confBadge(f.confidence)}</td>
          <td class="tools"><button class="btn quiet" data-edit="${f.fact_id}">Edit</button><button class="btn danger" data-del="${f.fact_id}">Delete</button></td>
        </tr>`).join("")}</tbody></table></div>` : `<div class="empty">No facts were found in this chapter.</div>`}`;

    document.getElementById("resubmit").onclick = (e) => {
      e.preventDefault();
      location.hash = "#/add";
      setTimeout(() => {
        document.getElementById("cid").value = ch.chapter_id;
        document.getElementById("cnum").value = ch.chapter_number;
        document.getElementById("ctext").value = ch.text;
      }, 0);
    };
    document.getElementById("delete-chapter").onclick = async () => {
      if (!confirm(`Delete ${ch.chapter_id} and everything taken from it?`)) return;
      try { await book(`/chapters/${encodeURIComponent(ch.chapter_id)}`, { method: "DELETE" }); location.hash = "#/add"; refreshSidebar(); }
      catch (err) { document.getElementById("fact-msg").innerHTML = errorBox(err); }
    };
    const msg = document.getElementById("fact-msg");
    view.querySelector("tbody")?.addEventListener("click", async (e) => {
      const t = e.target;
      if (t.dataset.del) {
        if (!confirm("Delete this fact?")) return;
        try { await book(`/facts/${t.dataset.del}`, { method: "DELETE" }); viewChapter(chapterId); refreshSidebar(); }
        catch (err) { msg.innerHTML = errorBox(err); }
      }
      if (t.dataset.edit) {
        const row = t.closest("tr");
        const attr = row.querySelector(".f-attr"), val = row.querySelector(".f-val");
        attr.innerHTML = `<input type="text" value="${esc(attr.textContent.replace(/ /g, "_"))}" aria-label="Detail">`;
        val.innerHTML = `<input type="text" value="${esc(val.textContent)}" aria-label="Value">`;
        t.textContent = "Save"; delete t.dataset.edit; t.dataset.save = row.dataset.fact;
        return;
      }
      if (t.dataset.save) {
        const row = t.closest("tr");
        const [attribute, value] = [...row.querySelectorAll("input")].map(i => i.value.trim());
        try { await book(`/facts/${t.dataset.save}`, { method: "PATCH", body: { attribute, value } }); viewChapter(chapterId); }
        catch (err) { msg.innerHTML = errorBox(err); }
      }
    });
  } catch (err) { view.innerHTML = errorBox(err); }
}

// ---------- routing ----------
function route() {
  const parts = (location.hash.replace(/^#\/?/, "") || "add").split("/").map(decodeURIComponent);
  let [page, arg] = parts;
  if (currentBook == null) page = "books";
  document.querySelectorAll("#tabs a").forEach(a => a.toggleAttribute("aria-current", a.dataset.tab === page));
  document.querySelectorAll("#tabs a[aria-current]").forEach(a => a.setAttribute("aria-current", "page"));
  refreshSidebar(page === "chapter" ? arg : null);
  if (page === "books") viewBooks();
  else if (page === "issues") viewIssues();
  else if (page === "characters" && arg) viewEntity(arg);
  else if (page === "characters") viewCharacters();
  else if (page === "timeline") viewTimeline();
  else if (page === "ask") viewAsk();
  else if (page === "chapter" && arg) viewChapter(arg);
  else viewAdd();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
document.getElementById("book-select").onchange = (e) => {
  currentBook = Number(e.target.value);
  rememberBook(currentBook);
  location.hash = "#/add";
  route();
};
loadBooks().catch(err => { view.innerHTML = errorBox(err); }).finally(route);
</script>
