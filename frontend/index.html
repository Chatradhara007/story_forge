<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StoryForge</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%232F5D50'/><path d='M9 22c4-1 6-6 14-12' stroke='white' stroke-width='3' fill='none' stroke-linecap='round'/></svg>">
<link rel="preload" href="fonts/amatic-sc-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/nunito-sans-latin-300-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip" href="#view">Skip to content</a>
<div id="landing" hidden></div>
<div id="signin" class="signin" hidden></div>
<div id="app" hidden>
  <header class="topbar">
    <div class="bar">
      <a class="mark" href="#/shelf" aria-label="Your books">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M7 6h13a5 5 0 0 1 5 5v15H12a5 5 0 0 1-5-5z" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M11 13h10M11 18h7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </a>
      <div class="book-pick"><label for="book-select" class="sr-only">Book</label><select id="book-select"></select></div>
      <nav aria-label="Pages" class="tabs-nav"><ul id="nav">
        <li><a href="#/shelf" data-page="shelf">Books</a></li>
        <li data-book-only><a href="#/overview" data-page="overview">Overview</a></li>
        <li data-book-only class="chapters-menu">
          <details id="chapters-dd"><summary data-page="chapters">Chapters</summary>
            <div class="dropdown"><ol class="chapter-list" id="chapter-list"></ol>
              <div class="dd-foot"><a href="#/chapters">All chapters</a><a href="#/add">Add chapters</a></div></div></details></li>
        <li data-book-only><a href="#/issues" data-page="issues">Issues <span class="count-pill" id="issue-count" hidden></span></a></li>
        <li data-book-only><a href="#/map" data-page="map">Character map</a></li>
        <li data-book-only><a href="#/bible" data-page="bible">Story bible</a></li>
        <li data-book-only><a href="#/timeline" data-page="timeline">Timeline</a></li>
        <li data-book-only><a href="#/ask" data-page="ask">Ask</a></li>
      </ul></nav>
      <div class="bar-right">
        <div id="activity" class="activity" hidden aria-live="polite"></div>
        <details class="account" id="account" hidden></details>
      </div>
    </div>
  </header>
  <main id="view" tabindex="-1"></main>
</div>
<script src="charts.js"></script>
<script src="app.js"></script>
</body>
</html>
