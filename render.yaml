# One-click deployment on Render (https://render.com). See DEPLOY.md.
services:
  - type: web
    name: storyforge
    runtime: docker
    plan: free            # sleeps when idle; use "starter" so background jobs aren't cut off
    healthCheckPath: /health
    envVars:
      - key: NVIDIA_API_KEY
        sync: false          # paste in Render's dashboard
      - key: DATABASE_URL
        sync: false          # your hosted Postgres address (e.g. from Neon)
      - key: AUTH_REQUIRED
        value: "true"        # sign-in required: books are private, AI use is budgeted
      - key: SECRET_KEY
        generateValue: true  # signs sign-in sessions; Render generates a random one
      - key: DAILY_CHAPTER_LIMIT
        value: "40"          # chapter checks per user per day (0 = unlimited)
      - key: ALLOW_REGISTRATION
        value: "true"        # set "false" once everyone who needs an account has one
      - key: INVITE_CODE
        sync: false          # optional: only people with this code can create accounts
      - key: MAX_REQUESTS_PER_MINUTE
        value: "30"
      - key: BEHIND_PROXY
        value: "true"        # Render's proxy adds the visitor's real address; used to slow password guessing
      - key: APP_URL
        sync: false          # e.g. https://storyforge-xxxx.onrender.com (for password-reset links)
      - key: CHAT_MODEL
        value: "nvidia/nemotron-3.5-lightning-30b-a3b,nvidia/nemotron-3-nano-omni-30b-a3b-reasoning"
      - key: JUDGE_MODEL
        value: "nvidia/nemotron-3.5-lightning-30b-a3b"
      - key: CHAT_THINKING_JUDGING
        value: "off"
      # Measured 18 Oct 2026 on the free NVIDIA tier (eval/): the checks done in code catch the
      # mistakes with no false alarms; the AI checker and AI name linking added false alarms
      # and long timeouts. Switch CHECKER on later with a faster paid model for "Worth a look".
      - key: CHECKER
        value: "off"
      - key: SAFETY_NET
        value: "off"
      - key: NAME_LINKING
        value: "rules"
      - key: AI_REQUEST_TIMEOUT
        value: "60"
      - key: AI_RETRY_ATTEMPTS
        value: "3"
      - key: SMTP_HOST
        sync: false          # optional: send password-reset emails (else the link goes to the log)
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
